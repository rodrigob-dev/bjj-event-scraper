name: scrape-events

on:
  schedule:
    - cron: '0 6 * * *' # todo dia 06:00 UTC (03:00 BRT) — prazos de inscrição mudam diariamente
  workflow_dispatch: {} # permite rodar manualmente

permissions:
  contents: write # p/ commitar data/events.json

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The `secrets` context is not allowed in a step's `if:` (GitHub rejects the
    # whole file and logs a failed run with no jobs on every push). A job-level
    # env copy of the token is, so the dispatch step tests that instead.
    env:
      DISPATCH_TOKEN: ${{ secrets.SENSEI_WEB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Playwright só é instalado se algum adapter usar strategy:'browser'.
      # Hoje todas as fontes são HTTP-first, então fica desligado por padrão.
      - name: Install Playwright (fallback)
        if: ${{ vars.USE_BROWSER == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Scrape
        run: npm run scrape
        env:
          # Secret do repositório. Se não estiver setado, o scraper só gera o
          # events.json (o upsert no Supabase é pulado).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Validate
        run: npm run validate

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "bjj-scraper-bot"
          git config user.email "bjj-scraper-bot@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "Sem mudanças no events.json."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: atualiza events.json ($(date -u +%FT%TZ))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Acorda o sync do sensei-web (workflow sync-competitions.yml, gatilho
      # repository_dispatch `scraper-updated`) assim que o JSON novo está no
      # main. Precisa de um PAT com escopo `repo` no sensei-web, guardado no
      # secret SENSEI_WEB_DISPATCH_TOKEN; sem o secret o passo é pulado e o
      # cron diário do sensei-web faz o sync. `-f` falha alto em 3xx/4xx — o
      # repo já mudou de nome duas vezes, e um redirect silencioso não dispara nada.
      - name: Notify sensei-web (repository_dispatch scraper-updated)
        if: ${{ steps.commit.outputs.changed == 'true' && env.DISPATCH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rodrigob-dev/sensei-web/dispatches \
            -d '{"event_type":"scraper-updated"}'
