// FUNÇÕES - GERENCIAMENTO DOS EVENTOS

// Função para renderizar eventos
function renderEvents() {
    const container = document.getElementById('fpjj-events-2026');
    
    if (!container) return;
    
    // Limpa o container
    container.innerHTML = '';
    
    // Ordena eventos por mês (opcional)
    const ordemMeses = {
        'Fevereiro': 1,
        'Março': 2,
        'Abril/Maio': 3,
        'Maio': 4,
        'Junho': 5,
        'Julho': 6,
        'Agosto': 7,
        'Setembro': 8,
        'Outubro': 9,
        'Novembro': 10,
        'Novembro/Dezembro': 11
    };
    
    const eventosOrdenados = [...eventsData].sort((a, b) => {
        return (ordemMeses[a.mes] || 99) - (ordemMeses[b.mes] || 99);
    });
    
    // Renderiza cada evento
    eventosOrdenados.forEach(event => {
        const confirmacaoText = event.confirmacao === 'confirmado' 
            ? 'Confirmado' 
            : 'Aguardando';
        
        const confirmacaoClass = event.confirmacao === 'confirmado' 
            ? 'confirmado' 
            : 'aguardando';
        
        const card = document.createElement('div');
        card.className = `fpjj-event-card ${event.highlight ? 'highlight' : ''}`;
        card.innerHTML = `
            <div class="fpjj-event-info">
                <h3 class="fpjj-event-title">${event.title}</h3>
                <div class="fpjj-event-details">
                    <div class="fpjj-detail-item">
                        <i class="far fa-calendar-alt"></i>
                        <span>${event.date}</span>
                        <span class="fpjj-confirmacao ${confirmacaoClass}">${confirmacaoText}</span>
                    </div>
                    <div class="fpjj-detail-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>${event.local}</span>
                    </div>
                </div>
                <div class="fpjj-realizacao">
                    <i class="fas fa-building"></i>
                    <span>${event.realizacao}</span>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}
